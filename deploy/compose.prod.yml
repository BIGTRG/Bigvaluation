# {{BRAND_NAME}} — production overrides for the fleet.
# Usage: docker compose -f docker-compose.yml -f deploy/compose.prod.yml --env-file .env.prod up -d --build
services:
  db:
    ports: !override []
    environment:
      POSTGRES_USER: flip
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: flipmaster
  minio:
    ports: !override []
    environment:
      MINIO_ROOT_USER: flipminio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
  api:
    ports: !override
      - "8103:8787"
    environment:
      PORT: "8787"
      NODE_ENV: production
      DATABASE_URL: postgres://flip:${PG_PASSWORD}@db:5432/flipmaster
      MIGRATE_ON_BOOT: "1"
      SEED_API_KEY: ${SEED_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      REPORTS_BASE_URL: http://178.105.21.227:8103/reports
      CAPTURE_BASE_URL: http://178.105.21.227:8103/capture
      GOTENBERG_URL: http://gotenberg:3000
      WATCH_INTERVAL_MS: "86400000"
      WATCH_CHANGE_THRESHOLD: "0.02"
